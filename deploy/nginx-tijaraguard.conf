# Example Nginx TLS Reverse Proxy for TijaraGuard
limit_req_zone $binary_remote_addr zone=tijaraguard_api:10m rate=120r/m;

server {
    listen 443 ssl http2;
    server_name tijaraguard.example.com;

    ssl_certificate     /etc/letsencrypt/live/tijaraguard.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tijaraguard.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        limit_req zone=tijaraguard_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
